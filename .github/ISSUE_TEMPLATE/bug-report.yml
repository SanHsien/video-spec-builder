name: "🪲 Bug Report"
description: "回報 video-spec-builder 維護型 fork、Skill 提問引導或分鏡規範的問題"
labels: ["bug"]
body:
  - type: "markdown"
    attributes:
      value: |
        > [!IMPORTANT]
        > 提交問題前，請先確認：
        > 1. 問題在最新 `main` 仍可重現。
        > 2. 請勿在此附上包含機密資料、個人個資或受保護版權的內容。若涉及安全性，請走 [Security Advisory](https://github.com/SanHsien/video-spec-builder/security/advisories/new)。

  - type: "dropdown"
    id: "module"
    attributes:
      label: "發生問題的模組或功能"
      description: "請選擇是在使用哪項功能時發生問題"
      options:
        - "Agent Skill 核心 (SKILL.md)"
        - "編導追問與拆鏡規則 (references/)"
        - "分鏡輸出模板 (templates/)"
        - "Spec Mono 主題系統 (spec-mono/)"
        - "Full Code React 預覽組件 (Full Code/)"
        - "Windows 本機維護環境 (tools/dev_check.ps1)"
        - "其他"
    validations:
      required: true

  - type: "dropdown"
    id: "os"
    attributes:
      label: "作業系統環境"
      options:
        - "Windows 11 原生 (PowerShell)"
        - "Windows 10"
        - "Ubuntu / Linux"
        - "macOS"
    validations:
      required: true

  - type: "input"
    id: "runtime-version"
    attributes:
      label: "Node.js / Python 版本"
      placeholder: "例如：Node 20.x / Python 3.12"
    validations:
      required: true

  - type: "textarea"
    id: "description"
    attributes:
      label: "問題描述"
      description: "簡要清楚地說明問題"
    validations:
      required: true

  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "重現步驟或提示詞"
      description: "請提供可重現問題的提示詞、輸入或指令"
    validations:
      required: true

  - type: "textarea"
    id: "expected"
    attributes:
      label: "預期行為與實際行為"
      description: "預期結果為何？實際發生了什麼？"
    validations:
      required: true
